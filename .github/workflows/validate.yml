name: Validate and Publish

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: roblox-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate project structure
        run: node scripts/validate.mjs
      - name: Install Rojo
        run: |
          curl -fsSL https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o rojo.zip
          unzip -q rojo.zip
          chmod +x rojo
      - name: Build Roblox place
        run: ./rojo build default.project.json --output OneRuleTown.rbxlx
      - name: Upload playable Roblox place
        uses: actions/upload-artifact@v4
        with:
          name: OneRuleTown-Roblox-Place
          path: OneRuleTown.rbxlx
          if-no-files-found: error
      - name: Publish place to Roblox
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: |
          test -n "$ROBLOX_API_KEY"
          test -n "$ROBLOX_UNIVERSE_ID"
          test -n "$ROBLOX_PLACE_ID"

          response_file="$(mktemp)"
          for attempt in {1..8}; do
            http_code="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              "https://apis.roblox.com/universes/v1/${ROBLOX_UNIVERSE_ID}/places/${ROBLOX_PLACE_ID}/versions?versionType=Published" \
              --header "x-api-key: ${ROBLOX_API_KEY}" \
              --header "Content-Type: application/xml" \
              --data-binary "@OneRuleTown.rbxlx" || true)"

            cat "$response_file"
            if [[ "$http_code" =~ ^2 ]]; then
              echo "Roblox place published successfully."
              exit 0
            fi

            if [[ "$http_code" == "409" || "$http_code" =~ ^5 || -z "$http_code" ]]; then
              if [[ "$attempt" -lt 8 ]]; then
                echo "Roblox is temporarily busy (HTTP ${http_code:-network-error}); retrying in 20 seconds."
                sleep 20
                continue
              fi
            fi

            echo "Roblox publishing failed with HTTP ${http_code:-network-error}."
            exit 1
          done

          echo "Roblox remained busy after all publish attempts."
          exit 1

