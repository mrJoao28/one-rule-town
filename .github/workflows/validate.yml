name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate project structure
        run: node scripts/validate.mjs
      - name: Install Rojo
        run: |
          curl -fsSL https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o rojo.zip
          unzip -q rojo.zip
          chmod +x rojo
      - name: Build Roblox place
        run: ./rojo build default.project.json --output OneRuleTown.rbxlx

